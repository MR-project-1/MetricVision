# Base configuration for our RealSense D455 wheelchair sequences (stereo IR, emitter OFF); upgrades off.
# configs/final_wheelchair.yaml switches every upgrade on.
# Sequences start and end at the same marked spot: summary.json reports loop_closure_error_m/_pct (FTE).
# Run: uv run metricvision run configs/wheelchair.yaml --dataset-root /data/wheelchair/lab_01 --run-name base
output_dir: results  # Results go to results/<dataset tag>/<matcher>/.
max_frames: null  # null = process every frame.
pipeline: sparse  # "sparse": stereo front end + rigid-rig VO (the method); "dense": ORB/SIFT + SGBM keyframe VO (baseline only).

dataset:
  name: stereo_folder  # Folder written by scripts/extract_rosbag.py (left/, right/, calib.yaml).
  params:
    root: /data/wheelchair/lab_01  # One recorded sequence.
    calib: null  # null = <root>/calib.yaml (ChArUco from scripts/calibrate_charuco.py, or factory_calib.yaml).
    already_rectified: false  # true only with the factory calibration of the rectified IR streams and zero distortion.
    stride: 1  # 2 = use 15 of 30 Hz.

matcher:
  name: orb  # Front end under test; override with --matcher sift.
  params:
    max_keypoints: 2000  # Keypoint budget, kept equal across extractors.
    ratio: 0.8  # Lowe ratio-test threshold.
    mutual_check: true  # Keep only mutual nearest neighbours.

stereo_frontend:  # Used when pipeline is sparse: FAST + ORB stereo matching, KLT with circular L/R check.
  name: fast_orb_klt
  params:
    max_features: 1500  # Target number of tracked stereo pairs.
    replenish_fraction: 0.7  # Re-detect when tracks drop below this fraction of max_features (runtime knob).
    fast_threshold: 10  # FAST corner threshold (lower for low-texture indoor corridors).
    circular_tolerance_px: 1.0  # Closing error allowed in the circular check.
    epipolar_tolerance_px: 1.5  # Row difference allowed between left and right.
    stereo_matcher: orb  # orb (descriptor + ratio test) | klt (sub-pixel KLT along the epipolar line, L->R->L checked).
    corner_score: fast  # fast | min_eig (Shi-Tomasi score: better-conditioned KLT windows).
    fast_threshold_min: null  # e.g. 5: low-threshold FAST top-up in grid cells the main threshold leaves empty.

depth:
  name: sgbm  # Fixed stereo depth source.
  params:
    num_disparities: 96  # fx*B is about 48 px*m, so this covers depths down to ~0.5 m.
    block_size: 5  # Matching window.
    min_depth: 0.5  # Ignore anything closer (metres).
    max_depth: 20.0  # Machine hall and Vicon room are well within this.

odometry:
  essential_threshold_px: 1.0  # Inlier threshold for the front-end quality metric.
  stereo_sigma_px: 0.5  # Pixel/disparity noise for triangulation covariance (weights the LM).
  sparse_point_anchor: fused  # Sparse only: previous (frame-to-frame) | birth (keep first 3D) | fused (inverse-covariance fusion).
  anchor_param: xyz  # Birth/fused anchors: xyz (Gaussian world point) | inverse_depth (1-D fusion on the birth ray).
  anchor_pose_inflation: false  # Add the LM pose covariance to new point observations (stops over-confident anchors).
  noise_model: fixed  # fixed (stereo_sigma_px) | adaptive (re-estimated from whitened LM residuals).
  max_depth_baselines: 0  # Depth gate for pose estimation in baselines (0 = off; heuristic baseline for covariance weighting).
  realign_every: 0  # Re-align tracks >= realign_min_age frames old against their birth template every N frames (0 = off; 5 is a good value).
  rig_mode: rigid  # rigid (one pose, both images) | independent (per-camera PnP, implied extrinsic logged) | averaged (SE(3) mean).
  pose_method: pnp  # pnp (rig LM) | umeyama3d | mahalanobis3d | soft  (alternative estimators on the same RANSAC inliers).
  ba_window: 0  # Sliding-window bundle adjustment over this many keyframes (0 = off; 5-7 typical).
  ba_keyframe_every: 3  # Keyframe every N frames...
  ba_min_translation_m: 0.3  # ...or after this much motion (wheelchair, indoor).
  pnp:
    reprojection_error_px: 2.0  # PnP RANSAC inlier threshold.
    iterations: 200  # PnP RANSAC iterations.
    min_inliers: 15  # Below this, the frame counts as a tracking failure.
    refine: lm  # none | opencv (cv2.solvePnPRefineLM) | lm (covariance-weighted rigid-rig LM, analytic Jacobians).
    ransac: opencv  # opencv (solvePnPRansac, left image) | stereo (AP3P + MSAC on the (u_l, v_l, u_r) rig residual).
    lm_pixel_sigma: null  # null = share stereo_sigma_px (one noise model); 1.0 reproduces the mid-report runs.
  keyframe:
    min_inliers: 100  # New keyframe when inliers drop below this.
    max_translation_m: 0.5  # ...or after this much motion (indoor scale).
    max_rotation_deg: 10.0  # ...or this much rotation (drones rotate quickly).
    max_frames: 20  # ...or this many frames (1 s at 20 Hz).