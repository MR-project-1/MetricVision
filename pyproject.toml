[project]
name = "metricvision"  # Package name used for imports and the command-line tool.
version = "0.1.0"  # Version of the benchmark code.
description = "End-to-end benchmark of feature extractors for stereo visual odometry."  # One-line summary.
readme = "README.md"  # Long description shown by packaging tools.
requires-python = ">=3.10,<3.13"  # 3.10 is pinned in .python-version to match ROS 2 Humble and JetPack 6 wheels.
dependencies = [
    "numpy>=1.24",  # Array maths for images, points and poses.
    "opencv-python-headless>=4.8",  # ORB, SIFT, SGBM, PnP, RANSAC; headless avoids GUI libraries in containers.
    "scipy>=1.10",  # Rotation conversions between matrices and quaternions.
    "pyyaml>=6.0",  # Parsing experiment configs and EuRoC sensor calibration files.
    "evo>=1.28",  # Trajectory association, alignment and ATE/RPE metrics.
    "tqdm>=4.66",  # Progress bars while processing sequences.
]

[project.scripts]
metricvision = "metricvision.cli:main"  # Installs a `metricvision` command that calls metricvision.cli.main().

[project.optional-dependencies]
learned = [
    "torch>=2.4",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=8.0",  # Test runner.
    "ruff>=0.6",  # Linter and formatter.
    "mypy>=1.10",  # Static type checker for the type hints.
    "types-PyYAML",  # Type stubs for PyYAML so mypy can check yaml calls.
    "types-tqdm",  # Type stubs for tqdm.
]

[build-system]
requires = ["hatchling"]  # Lightweight build backend used by uv to install the package.
build-backend = "hatchling.build"  # Entry point of the build backend.

[tool.hatch.build.targets.wheel]
packages = ["src/metricvision"]  # Source layout: the importable package lives under src/.

[tool.ruff]
line-length = 150  # Generous limit: code lines carry trailing explanatory comments.
target-version = "py310"  # Lint against Python 3.10 syntax.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, naming.
ignore = [
    "E501",  # Long lines are allowed because every line carries an explanatory comment.
    "N803",  # Allow maths-style argument names such as K.
    "N806",  # Allow maths-style local names such as T_world_cam.
]

[tool.mypy]
python_version = "3.10"  # Type-check against the deployment Python version.
ignore_missing_imports = true  # cv2 and evo ship without complete type stubs.
warn_unused_ignores = true  # Keep `# type: ignore` comments honest.

[tool.pytest.ini_options]
testpaths = ["tests"]  # Where pytest looks for tests.

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]  # Optional `learned` extra: huge typed packages.
follow_imports = "skip"  # Do not analyse them (keeps mypy fast); they are only used in depth/mono_metric.py.
